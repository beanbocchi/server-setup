#!/usr/sbin/nft -f

# Firewall config — managed by /usr/local/bin/fw
# WARNING: Never use "flush ruleset" — it destroys Docker's table too
#
# Architecture: single GATE at prerouting filters ALL external traffic
# One set of allowed ports controls both host AND container access
#
# Priority chain:
#   -300  Docker raw (DROP DIRECT ACCESS)
#   -200  conntrack (connection tracking)
#   -150  ★ GATE (this chain — filter by port)
#   -100  Docker DNAT (port → container)
#      0  INPUT/FORWARD (defense-in-depth)

destroy table inet firewall

table inet firewall {

    # --- Named sets: fw allow/block modifies these ---

    set allowed_tcp {
        type inet_service
        flags interval
        elements = { 22 }
    }

    set allowed_udp {
        type inet_service
        flags interval
    }

    set blocked_ips {
        type ipv4_addr
        flags interval
    }

    # Trusted interfaces — add VPN/other interfaces here if needed
    # e.g., "wg0", "tailscale0", "br-custom"
    set trusted_ifaces {
        type ifname
        elements = { "lo", "docker0" }
    }

    # --- GATE: single entry point for ALL external traffic ---
    # policy drop: fail-closed — if rules are flushed, everything is blocked

    chain gate {
        type filter hook prerouting priority -150; policy drop;

        # Trusted interfaces — never filter
        iifname @trusted_ifaces accept
        iifname "br-*" accept

        # External traffic from here
        ct state invalid drop
        ct state { established, related } accept
        ip saddr @blocked_ips drop
        meta l4proto { icmp, icmpv6 } accept
        tcp dport @allowed_tcp accept
        udp dport @allowed_udp accept

        # Rate-limited reject, then silent drop for the rest
        limit rate 5/second counter reject with icmpx type admin-prohibited
        counter drop
    }

    # --- INPUT: defense-in-depth for host ---

    chain input {
        type filter hook input priority filter; policy drop;

        ct state invalid drop
        ct state { established, related } accept
        iif lo accept

        # Docker embedded DNS: containers resolve via the bridge-gateway
        # resolver (e.g. 172.19.0.1:53). This lands in INPUT (dst = host
        # bridge IP), so it must be allowed here — the gate's "br-*" trust
        # does not carry to the input hook. Without this, ICMP passes below
        # (ping works) but DNS is rejected → containers get EAI_AGAIN.
        iifname "docker0" meta l4proto { tcp, udp } th dport 53 accept
        iifname "br-*" meta l4proto { tcp, udp } th dport 53 accept

        ip saddr @blocked_ips drop
        meta l4proto { icmp, icmpv6 } accept
        tcp dport @allowed_tcp accept
        udp dport @allowed_udp accept
        pkttype host limit rate 5/second counter reject with icmpx type admin-prohibited
        counter
    }

    # --- FORWARD: Docker manages container routing ---

    chain forward {
        type filter hook forward priority filter; policy accept;
    }

    # --- OUTPUT: no restrictions ---

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
